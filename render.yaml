services:
  - type: web
    name: freelance-bid-portal-server
    env: node
    plan: starter
    branch: main
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: MONGODB_URI
        value: "${MONGODB_URI}"
      - key: JWT_SECRET
        value: "${JWT_SECRET}"
  - type: static_site
    name: freelance-bid-portal-client
    env: static
    plan: starter
    branch: main
    buildCommand: cd client && npm install && npm run build
    publishPath: client/dist
